name: release

# Push a tag vX.Y.Z to build binaries for every platform and publish them
# in the GitHub release of that tag. Manual runs only build the archives
# (workflow artifacts). The "bundles" release with offline doc bundles is
# never touched here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux (static, musl) and Windows, cross-compiled with zig cc:
  # mattn/go-sqlite3 needs cgo.
  build-linux-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, target: x86_64-linux-musl }
          - { goos: linux, goarch: arm64, target: aarch64-linux-musl }
          - { goos: windows, goarch: amd64, target: x86_64-windows-gnu }
          - { goos: windows, goarch: arm64, target: aarch64-windows-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
          cache-key: ${{ matrix.target }}
      - name: build
        run: ./scripts/release-build.sh "${{ github.ref_name }}" ${{ matrix.goos }} ${{ matrix.goarch }} "zig cc -target ${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: marvindocs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*

  # macOS: Apple clang builds both architectures on one runner.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build
        run: ./scripts/release-build.sh "${{ github.ref_name }}" darwin ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: marvindocs-darwin-${{ matrix.goarch }}
          path: dist/release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum marvindocs_* > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --title "marvindocs $TAG" -R "$GITHUB_REPOSITORY"
          fi
