name: docker

# Push a tag vX.Y.Z to publish images to ghcr.io/<repo>:
#   X.Y.Z, latest       target empty: no docs, bundles installed at runtime
#   X.Y.Z-full, full    target full: every offline bundle baked in
# Manual runs publish edge and edge-full. Each architecture is built on a
# native runner and pushed as <tag>-<arch>, then joined into one manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The full image unpacks ~4.5 GB of docs and is exported and
      # compressed on the runner.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: empty
        uses: docker/build-push-action@v6
        with:
          context: .
          target: empty
          build-args: VERSION=${{ env.TAG }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
      # Reuses the empty stages from the builder cache of the step above.
      - name: full
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          build-args: VERSION=${{ env.TAG }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-full-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: multi-arch tags
        run: |
          V=${TAG#v}
          latest=(); full=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then latest=(-t "$IMAGE:latest"); full=(-t "$IMAGE:full"); fi
          docker buildx imagetools create -t "$IMAGE:$V" "${latest[@]}" \
            "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"
          docker buildx imagetools create -t "$IMAGE:$V-full" "${full[@]}" \
            "$IMAGE:$V-full-amd64" "$IMAGE:$V-full-arm64"
          docker buildx imagetools inspect "$IMAGE:$V"
