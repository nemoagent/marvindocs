name: docker

# Push a tag vX.Y.Z to publish the image to ghcr.io/<repo> as X.Y.Z and
# latest: target empty, no docs, bundles are installed at runtime with
# `marvindocs bundle install`. Manual runs publish edge. Each architecture
# is built on a native runner and pushed as <tag>-<arch>, then joined into
# one manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: empty
        uses: docker/build-push-action@v6
        with:
          context: .
          target: empty
          build-args: VERSION=${{ env.TAG }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: multi-arch tags
        run: |
          V=${TAG#v}
          latest=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then latest=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create -t "$IMAGE:$V" "${latest[@]}" \
            "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"
          docker buildx imagetools inspect "$IMAGE:$V"
