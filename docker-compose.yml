# Compose file for running marvindocs locally with persistent volumes.
#
#   docker compose up -d         # build and start
#   docker compose logs -f       # tail logs
#   docker compose down          # stop
#
# Bring your own data: scripts/sync-docs.sh writes into ./data/public/docs,
# and the SQLite index is expected in ./data/index/marvindocs.db (a
# directory, not a single file: SQLite WAL needs to create -wal/-shm
# next to it). Both are bind-mounted so rebuilds persist across recreates.
#
# Vector search: set MARVINDOCS_EMBEDDER=ollama and MARVINDOCS_OLLAMA_URL
# in .env. An Ollama running on the docker host is reachable from the
# container as http://host.docker.internal:11434 (see extra_hosts).
# For an OpenAI-compatible server such as vLLM set MARVINDOCS_EMBEDDER=openai
# and MARVINDOCS_OPENAI_URL (for example http://host.docker.internal:8000/v1).
#
# The container binds 0.0.0.0 and port 3333 is published on every host
# interface, so the server refuses to start without a token. Either:
#
#   MARVINDOCS_AUTH_TOKEN=$(openssl rand -hex 32) docker compose up -d
#   (or put MARVINDOCS_AUTH_TOKEN=... into a .env file next to this one)
#
# or, for a trusted machine only, MARVINDOCS_INSECURE=1 docker compose up -d.

services:
  marvindocs:
    build: .
    image: marvindocs:latest
    container_name: marvindocs
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ./data/public/docs:/data:ro
      - ./data/index:/index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MARVINDOCS_LOG_FORMAT: json
      MARVINDOCS_LOG_LEVEL: info
      MARVINDOCS_AUTH_TOKEN: ${MARVINDOCS_AUTH_TOKEN:-}
      MARVINDOCS_INSECURE: ${MARVINDOCS_INSECURE:-}
      MARVINDOCS_EMBEDDER: ${MARVINDOCS_EMBEDDER:-none}
      MARVINDOCS_OLLAMA_URL: ${MARVINDOCS_OLLAMA_URL:-http://host.docker.internal:11434}
      MARVINDOCS_OLLAMA_MODEL: ${MARVINDOCS_OLLAMA_MODEL:-bge-m3}
      MARVINDOCS_OPENAI_URL: ${MARVINDOCS_OPENAI_URL:-http://host.docker.internal:8000/v1}
      MARVINDOCS_OPENAI_MODEL: ${MARVINDOCS_OPENAI_MODEL:-bge-m3}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  godoc:
    image: ${GO_IMAGE:-golang:1.25}
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint: ["go", "doc"]
